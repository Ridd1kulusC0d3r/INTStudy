<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="250" viewBox="0 0 1280 250" role="img" aria-labelledby="t d"><title id="t">Jornada D a S</title><desc id="d">D orientar: pergunta. C analisar: matriz de evidências. B produzir: briefing. A validar: cenário. S contribuir: produto reproduzível.</desc><rect width="1280" height="250" rx="16" fill="#0b1b2b"/><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="38" fill="#8da6bb" font-size="13" letter-spacing="3">PROGRESSO MEDIDO PELO QUE VOCÊ CONSEGUE ENTREGAR</text><g transform="translate(40 70)"><rect width="224" height="144" rx="10" fill="#132b3e" stroke="#2c4a60"/><text x="18" y="43" fill="#53e0c2" font-size="34" font-weight="700">D</text><text x="18" y="79" fill="#f1f6fa" font-size="18">Orientar</text><text x="18" y="111" fill="#adbed0" font-size="14">Uma pergunta útil</text></g><g transform="translate(288 70)"><rect width="224" height="144" rx="10" fill="#132b3e" stroke="#2c4a60"/><text x="18" y="43" fill="#53e0c2" font-size="34" font-weight="700">C</text><text x="18" y="79" fill="#f1f6fa" font-size="18">Analisar</text><text x="18" y="111" fill="#adbed0" font-size="14">Matriz de evidências</text></g><g transform="translate(536 70)"><rect width="224" height="144" rx="10" fill="#132b3e" stroke="#2c4a60"/><text x="18" y="43" fill="#53e0c2" font-size="34" font-weight="700">B</text><text x="18" y="79" fill="#f1f6fa" font-size="18">Produzir</text><text x="18" y="111" fill="#adbed0" font-size="14">Briefing de inteligência</text></g><g transform="translate(784 70)"><rect width="224" height="144" rx="10" fill="#132b3e" stroke="#2c4a60"/><text x="18" y="43" fill="#53e0c2" font-size="34" font-weight="700">A</text><text x="18" y="79" fill="#f1f6fa" font-size="18">Validar</text><text x="18" y="111" fill="#adbed0" font-size="14">Cenário fundamentado</text></g><g transform="translate(1032 70)"><rect width="224" height="144" rx="10" fill="#132b3e" stroke="#2c4a60"/><text x="18" y="43" fill="#53e0c2" font-size="34"